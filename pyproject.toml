[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evaluation_engine"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2",
    "numpy>=2.0",
    "matplotlib>=3.8",
    "scikit-learn>=1.5",
    "torch>=2.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["evaluation_engine*"]
